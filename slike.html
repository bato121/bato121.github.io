<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background-color: white;
    font-family: "Inter", sans-serif;
    color: #111;
    line-height: 1.6;
  }

.galerija {
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 16px;
}

section {
  margin-top: 56px;
}

.mreza {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.mreza img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid #e5e5e5;
}

.nazaj {
  color: #666;
  font-weight: 600;
  text-decoration: none;
  cursor: cursor;
}
.mreza img {
  cursor: zoom-in;
}

#povecava {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.85);
  justify-content: center;
  align-items: center;
  cursor: zoom-out;
  z-index: 10;
}

#povecava.odprto {
  display: flex;
}

#povecava img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 8px;
}
</style>
</head>
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<body>
<main class="galerija">
<a href="index.html" class="nazaj"><- Nazaj</a>
<h1>Projekt</h1>
 <section id="streznik">
      <h2>Domači strežnik</h2>
      <p></p>
      <div class="mreza">
        <img src="server.jpg" alt="Strežnik">
        <img src="server2.jpg" alt="pcie to mini sas">
		<img src="server3.jpg" alt="lto6 bralnik">
		
      </div>
    </section>

    <section id="dron">
      <h2>Dron</h2>
      <p></p>
      <div class="mreza">
        <img src="dron1.jpg" alt="Sestavljen dron">
        <img src="dron2.jpg" >
      </div>
    </section>
  </main>
  <div id="povecava">
  <img src="" alt="">
</div>

<script>
  const povecava = document.getElementById("povecava");
  const velikaSlika = povecava.querySelector("img");

  document.querySelectorAll(".mreza img").forEach(function (slika) {
    slika.addEventListener("click", function () {
      velikaSlika.src = slika.src;
      velikaSlika.alt = slika.alt;
      povecava.classList.add("odprto");
    });
  });

  povecava.addEventListener("click", function () {
    povecava.classList.remove("odprto");
  });
</script>
</body>
</html>
